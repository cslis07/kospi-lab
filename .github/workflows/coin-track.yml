name: 코인 신호 추적·알림
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 신호 추적 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx --yes tsx scripts/coinTrack.mts
      - name: 변경분 커밋
        run: |
          git config user.name "kospi-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/coin-signals.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "[TRACK] 코인 신호 스냅샷·판정 갱신 [skip ci]"
            git push
          fi
