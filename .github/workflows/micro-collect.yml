# 미시 데이터 수집 — 호가 깊이·청산·거래소별 미결제약정(scripts/microCollect.mts).
# 왜: 적중률 연구(scripts/accuracy-lab.ts)에서 가격·거래량·펀딩은 표본 밖 50~53%였고, 남은 재료인 호가·청산은
# 무료 과거 이력이 없어 지금부터 쌓아야 한다. 공개 무키 API만 쓴다(실거래 주문·API 키 없음).
# 보관은 micro-data 브랜치(data/micro/YYYY-MM-DD.jsonl + state.json). data·etf-data·bnf-forward 브랜치와 섞지 않는다.
# 러너가 미국 IP라 바이낸스·바이비트는 배포된 앱(icn1) 경유로 받는다(호가 /api/micro/depth · OI·펀딩 /api/coin/derivs).
name: 미시 데이터 수집
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # coin-track(*/15)과 겹치지 않게 7분 밀어서
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: micro-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 오늘·어제 파일과 state.json 만 꺼낸다(스크립트는 이어 쓰기만 함). 나머지 날짜는 트리에 그대로 둔다.
      - name: 이전 기록 복원 (micro-data 브랜치)
        run: |
          git fetch --depth=1 origin micro-data 2>/dev/null || true
          mkdir -p data/micro
          if git rev-parse -q --verify origin/micro-data >/dev/null; then
            for f in state.json "$(date -u +%F).jsonl" "$(date -u -d yesterday +%F).jsonl"; do
              if git cat-file -e "origin/micro-data:data/micro/$f" 2>/dev/null; then
                git show "origin/micro-data:data/micro/$f" > "data/micro/$f"
              fi
            done
          fi
      - name: 수집 실행
        run: npx --yes tsx scripts/microCollect.mts
      # 임시 인덱스에 이전 트리를 읽고 바뀐 파일만 얹어 commit-tree — main 무접촉, vercel.json으로 배포 안 만듦
      - name: micro-data 브랜치에 커밋
        run: |
          set -e
          git config user.name "kospi-lab-bot"
          git config user.email "bot@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/micro-index"
          rm -f "$GIT_INDEX_FILE"
          PARENT=$(git rev-parse -q --verify origin/micro-data || true)
          if [ -n "$PARENT" ]; then git read-tree "$PARENT"; fi
          VJ=$(printf '{"git":{"deploymentEnabled":false}}\n' | git hash-object -w --stdin)
          git update-index --add --cacheinfo "100644,$VJ,vercel.json"
          for f in data/micro/*; do
            git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
          done
          TREE=$(git write-tree)
          if [ -n "$PARENT" ]; then
            COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "[TRACK] 미시 데이터 수집")
          else
            COMMIT=$(git commit-tree "$TREE" -m "[TRACK] 미시 데이터 수집")
          fi
          git push origin "$COMMIT":refs/heads/micro-data
